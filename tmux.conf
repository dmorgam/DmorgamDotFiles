# Tmux config

# ----- User config ---------------------------------------

# Start windows and panes at 1, not 0
set-option -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set-window-option -g mode-keys vi
set -g mouse on
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0

# Leader to A
set -g prefix C-a

# Splits preserving current path
bind '"' split-window -h -c "#{pane_current_path}"
bind '%' split-window -v -c "#{pane_current_path}"

# Reload tmux
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config recargada ✓"

# Fix colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Passthrough para bracketed paste (En WSL/Windows Terminal)
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

# ----- TPM Plugins ---------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# ----- Status bar (starship style: text · text) ----------
# After tpm: catppuccin sets window formats on load.
# Icons/colors reuse catppuccin module options. Module icons end in a space and
# module texts start with one, so the icon's trailing space is trimmed.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ' '
set -g window-status-separator '#[fg=#6c7086] · '
set -g window-status-format '#[fg=#{@thm_overlay_2}]#I #[fg=#{@thm_overlay_1}]#W#{?window_zoomed_flag,#{@catppuccin_window_flags_icon_zoom},}'
set -g window-status-current-format '#[fg=#{@thm_mauve}]#I #[fg=#{@thm_fg},bold]#W#[nobold]#{?window_zoomed_flag,#[fg=#{@thm_mauve}]#{@catppuccin_window_flags_icon_zoom},}'
set -g status-right '#[fg=#{E:@catppuccin_application_color}]#{s/ +$//:@catppuccin_application_icon}#{E:@catppuccin_application_text}'
set -ag status-right '#[fg=#{@thm_overlay_0}] · #[fg=#{E:@catppuccin_session_color}]#{s/ +$//:@catppuccin_session_icon}#{E:@catppuccin_session_text}'
set -ag status-right '#[fg=#{@thm_overlay_0}] · #[fg=#{E:@catppuccin_uptime_color}]#{s/ +$//:@catppuccin_uptime_icon}#{E:@catppuccin_uptime_text} '
