format = """\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$java\
$golang\
$rust\
$lua\
$helm\
$terraform\
$aws\
$azure\
$kubernetes\
$line_break\
$status\
$jobs\
$character\
"""

right_format = "$cmd_duration"

add_newline = true

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[username]
format = "[󱐋 $user](fg:mauve)[ · ](fg:overlay0)"
show_always = true
disabled = false

[directory]
format = "[ $path](fg:sapphire)[$read_only](fg:yellow)"
truncation_length = 1
fish_style_pwd_dir_length = 1
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " "

[git_branch]
format = "[ · ](fg:overlay0)[ $branch](fg:yellow)"

[git_status]
format = "[ · ](fg:overlay0)[ $all_status$ahead_behind](fg:peach)"
up_to_date = ""

[java]
format = "[ · ](fg:overlay0)[$symbol $version](fg:flamingo)"
symbol = ""
version_format = "${raw}"
disabled = false

[nodejs]
format = "[ · ](fg:overlay0)[$symbol $version](fg:yellow)"
symbol = ""
version_format = "${raw}"
disabled = false

[rust]
format = "[ · ](fg:overlay0)[$symbol $version](fg:red)"
symbol = ""
version_format = "${raw}"
disabled = false

[python]
format = '[ · ](fg:overlay0)[${symbol} ${pyenv_prefix}(${version})( \($virtualenv\))](fg:green)'
symbol = ""
version_format = "${raw}"
disabled = false

[c]
format = "[ · ](fg:overlay0)[$symbol ($version(-$name))](fg:blue)"
symbol = ""
version_format = "${raw}"
disabled = true

[golang]
format = "[ · ](fg:overlay0)[$symbol $version](fg:teal)"
symbol = ""
version_format = "${raw}"
disabled = false

[helm]
format = "[ · ](fg:overlay0)[$symbol $version](fg:sky)"
symbol = ""
version_format = "${raw}"
disabled = false

[lua]
format = "[ · ](fg:overlay0)[$symbol $version](fg:blue)"
symbol = ""
version_format = "${raw}"
disabled = false

[terraform]
format = "[ · ](fg:overlay0)[$symbol $version $workspace](fg:mauve)"
symbol = ""
version_format = "${raw}"
disabled = false

[aws]
format = "[ · ](fg:overlay0)[$symbol $region](fg:peach)"
symbol = ""
disabled = false

[azure]
format = "[ · ](fg:overlay0)[$symbol $subscription](fg:blue)"
symbol = "󰠅"
disabled = false

[kubernetes]
format = "[ · ](fg:overlay0)[$symbol $context](fg:blue)"
symbol = "☸ "
disabled = false

[cmd_duration]
format = "[ $duration](fg:maroon)"
min_time = 500

[status]
format = "[$symbol](fg:red)[ $status ](fg:peach)"
symbol = "✘"
disabled = false

[jobs]
format = "[$symbol $number ](fg:peach)"
symbol = ""
threshold = 1

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:green)"
